jenkins:
  systemMessage: "DevShield AI - local DevSecOps assessment lab (safe dummy data only)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-devshield-local-demo-only}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  markupFormatter: plainText

unclassified:
  location:
    url: "http://localhost:8080/"
    adminAddress: "DevShield AI Lab Admin <admin@local.invalid>"

jobs:
  - script: |
      pipelineJob('devshield-ai-assessment') {
        displayName('DevShield AI - Evidence Assessment')
        description('Clones and assesses one repository explicitly authorized by the operator. Produces evidence-led, advisory AI analysis. No exploitation is performed.')
        definition {
          cps {
            sandbox()
            script('''pipeline {
              agent any
              options { timestamps(); disableConcurrentBuilds() }
              stages {
                stage('Confirm lab scope and checkout') {
                  steps {
                    deleteDir()
                    echo 'DevShield AI - authorized repository assessment only; no exploitation.'
                    dir('source') {
                      git branch: env.DEVSHIELD_TOOL_GIT_BRANCH, url: env.DEVSHIELD_TOOL_GIT_URL
                    }
                    script {
                      if (env.DEVSHIELD_AUTHORIZATION_ACK != 'I_HAVE_PERMISSION') {
                        error('Set DEVSHIELD_AUTHORIZATION_ACK=I_HAVE_PERMISSION before assessing a repository.')
                      }
                      if (!env.DEVSHIELD_TARGET_GIT_URL?.trim()) {
                        error('Set DEVSHIELD_TARGET_GIT_URL to an authorized repository before building.')
                      }
                    }
                    dir('target') {
                      if (env.DEVSHIELD_TARGET_GIT_CREDENTIALS_ID) {
                        git branch: env.DEVSHIELD_TARGET_GIT_BRANCH, url: env.DEVSHIELD_TARGET_GIT_URL, credentialsId: env.DEVSHIELD_TARGET_GIT_CREDENTIALS_ID
                      } else {
                        git branch: env.DEVSHIELD_TARGET_GIT_BRANCH, url: env.DEVSHIELD_TARGET_GIT_URL
                      }
                    }
                    sh """
                      set -eu
                      test -f source/scripts/run-local-assessment.sh
                      test -f source/scripts/build-and-scan-image.sh
                      test -f source/scripts/analyze-evidence.py
                      test -f source/scripts/run-ai-security-analysis.py
                    """
                  }
                }
                stage('Collect baseline evidence') {
                  steps {
                    sh """
                      set -eu
                      mkdir -p generated /opt/devshield/evidence/generated
                      printf '%s\\n' \\
                        'DevShield AI authorized repository assessment' \\
                        "Target repository: ${env.DEVSHIELD_TARGET_GIT_URL}" \\
                        "Target branch: ${env.DEVSHIELD_TARGET_GIT_BRANCH}" \\
                        'Authorization acknowledgment: I_HAVE_PERMISSION' > generated/E001-baseline-scope.txt
                      git -C target rev-parse HEAD > generated/E002-target-commit.txt
                      find target -maxdepth 3 -type f | sort > generated/E003-target-file-inventory.txt
                      sha256sum generated/E001-baseline-scope.txt generated/E002-target-commit.txt generated/E003-target-file-inventory.txt > generated/E003-checksums.sha256
                      cp generated/* /opt/devshield/evidence/generated/
                    """
                    archiveArtifacts artifacts: 'generated/**', fingerprint: true
                  }
                }
                stage('Assess authorized repository') {
                  steps {
                    sh """
                      set -eu
                      rm -rf scan-results
                      mkdir -p scan-results
                      sh source/scripts/run-local-assessment.sh target scan-results /opt/devshield/evidence/generated
                    """
                    archiveArtifacts artifacts: 'scan-results/**', fingerprint: true, allowEmptyArchive: true
                  }
                }
                stage('Build and scan target container') {
                  steps {
                    sh """
                      set -eu
                      rm -rf container-results
                      mkdir -p container-results
                      sh source/scripts/build-and-scan-image.sh target container-results /opt/devshield/evidence/generated
                    """
                    archiveArtifacts artifacts: 'container-results/**', fingerprint: true, allowEmptyArchive: true
                  }
                }
                stage('Analyze evidence and prepare MITRE review') {
                  steps {
                    sh 'rm -rf analysis-results && mkdir -p analysis-results && python3 source/scripts/analyze-evidence.py scan-results container-results analysis-results /opt/devshield/evidence/generated'
                    archiveArtifacts artifacts: 'analysis-results/E014-local-analysis-summary.json, analysis-results/E015-mitre-d3fend-review-worksheet.json', fingerprint: true, allowEmptyArchive: true
                  }
                }
                stage('AI security analysis') {
                  steps {
                    sh 'python3 source/scripts/run-ai-security-analysis.py analysis-results /opt/devshield/evidence/generated'
                    archiveArtifacts artifacts: 'analysis-results/E016-ai-security-analysis.md, analysis-results/E017-ai-analysis-metadata.json, analysis-results/E018-ai-security-analysis.json', fingerprint: true, allowEmptyArchive: true
                  }
                }
                stage('Evidence integrity') {
                  steps {
                    sh """
                      set -eu
                      find /opt/devshield/evidence/generated -maxdepth 1 -type f ! -name 'E019-final-evidence-checksums.sha256' -print0 | sort -z | xargs -0 sha256sum > generated/E019-final-evidence-checksums.sha256
                      cp generated/E019-final-evidence-checksums.sha256 /opt/devshield/evidence/generated/
                    """
                    archiveArtifacts artifacts: 'generated/E019-final-evidence-checksums.sha256', fingerprint: true
                  }
                }
              }
              post {
                always { archiveArtifacts artifacts: 'generated/**, scan-results/**, container-results/**, analysis-results/**', fingerprint: true, allowEmptyArchive: true }
                success { echo 'DevShield AI assessment completed. AI and mappings require human review.' }
                failure { echo 'DevShield AI assessment failed. Review console output and evidence artifacts.' }
              }
            }''')
          }
        }
      }
