name: devshield-ai-lab

services:
  jenkins:
    build:
      context: ./jenkins
    user: root
    ports:
      - "${JENKINS_HTTP_PORT:-8080}:8080"
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc_configs/jenkins.yaml
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-devshield-local-demo-only}
      DEVSHIELD_TOOL_GIT_URL: ${DEVSHIELD_TOOL_GIT_URL:-https://github.com/AslamJabri/devsecops-ai.git}
      DEVSHIELD_TOOL_GIT_BRANCH: ${DEVSHIELD_TOOL_GIT_BRANCH:-main}
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins/casc:/var/jenkins_home/casc_configs:ro
      - ./evidence:/opt/devshield/evidence
      # Local lab only: permits Jenkins to build and inspect target images.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/login >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
volumes:
  jenkins_home:
